[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-learnability-transfer"
version = "0.1.0"
description = "Analysis tools for construct transfer and cross-construct learnability"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "ruptures>=1.1.9",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "jupyterlab>=4.2",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
